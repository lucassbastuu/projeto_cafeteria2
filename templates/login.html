{% extends "base.html" %}
{% block title %}Entrar · Cafeteria{% endblock %}
{% block content %}
<section class="panel">
  <h1>Entrar</h1>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      E-mail
      <input type="email" name="email" required maxlength="254" autocomplete="email">
    </label>
    <label>
      Senha
      <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="current-password">
    </label>
    <button type="submit" class="btn">Entrar</button>
  </form>
  <p class="switch">Não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
</section>
{% endblock %}
